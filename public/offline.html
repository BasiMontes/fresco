    <meta name="robots" content="noindex" />
    <!--
    FRESCO-979: the screen the service worker (/sw.js) serves when a navigation
    fails for lack of connection. It is STATIC on purpose:
    - No JavaScript. The CSP (proxy.ts) is `nonce` + `strict-dynamic`, so a
      script here, inline or external, would be blocked. "Reintentar" is a link
      to the current URL (`href=""`) and the retry is a `meta refresh`.
    - No account data. It is precached at install time and the same bytes go to
      every user; it must never be built from a session.
    - Self-contained: ONE file. The logo is inline SVG (the worker only answers
      navigations, so a separate image request would go to the network and fail
      offline) and the styles are inline.
    - Colours are the DESIGN.md tokens (light and dark) written as literals,
      because this file does not go through the Tailwind build.
  -->
    <meta http-equiv="refresh" content="20" />
    <title>Sin conexión · Fresco</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: #faf3e3;
        --surface-raised: #fbf6ec;
        --text: #201e1d;
        --tertiary: #6f5f43;
        --primary: #0f4e0e;
        --on-brand: #faf3e3;
        --border: rgba(32, 30, 29, 0.16);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #011101;
          --surface-raised: #0c2712;
          --text: #f2e8d2;
          --tertiary: #a99a7c;
          --primary: #63b85e;
          --on-brand: #04180a;
          --border: rgba(242, 232, 210, 0.45);
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 18px;
        background: var(--background);
        color: var(--text);
        font-family:
          Figtree,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        font-size: 15px;
        line-height: 1.55;
      }
      main {
        width: 100%;
        max-width: 28rem;
        padding: 32px 24px;
        text-align: center;
        background: var(--surface-raised);
        border: 1px solid var(--border);
        border-radius: 20px;
      }
      .logo {
        display: block;
        margin: 0 auto 24px;
      }
      .logo--dark {
        display: none;
      }
      @media (prefers-color-scheme: dark) {
        .logo--light {
          display: none;
        }
        .logo--dark {
          display: block;
        }
      }
      .icon {
        color: var(--tertiary);
      }
      h1 {
        margin: 12px 0 8px;
        font-family: Fraunces, Georgia, 'Times New Roman', serif;
        font-size: 32px;
        font-weight: 400;
        line-height: 1.08;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
      }
      .hint {
        margin-top: 8px;
        font-size: 13px;
        color: var(--tertiary);
      }
      .retry {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        margin-top: 24px;
        padding: 0 24px;
        border-radius: 999px;
        background: var(--primary);
        color: var(--on-brand);
        font-size: 14px;
        font-weight: 600;
        line-height: 1.2;
        text-decoration: none;
      }
      .retry:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 3px;
      }
    </style>
