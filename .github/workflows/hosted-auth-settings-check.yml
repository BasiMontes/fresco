name: Hosted Auth settings check

# FRESCO-1090 (audit 8, A8-AUTHZ-04). Whether a password change needs the current password,
# whether an email change is confirmed on both addresses, and whether captcha guards the Auth
# endpoints are toggles of the HOSTED Supabase project: `supabase/config.toml` has no key for
# the first one and says nothing about what production does. Audits 7 and 8 could only grade
# the finding PLAUSIBLE for that reason. This job reads the real settings (Management API,
# read only) and fails when one the app relies on is off, or cannot be read.
#
# FRESCO-1188 added what the confirmation and recovery emails depend on: mailer_autoconfirm, site_url, the
# redirect allow-list, and the three live email templates against supabase/templates/*.html (the checkout
# below is what gives the job those files).
#
# FRESCO-1169 added the Edge Functions: the live `verify_jwt` of each function against the `[functions.*]` blocks of
# supabase/config.toml (this checkout provides that file).
#
# It is not in pr-check.yml because it needs a token for the production project (ADR-0017).
# What it checks and how to repeat it by hand: docs/workflows/hosted-auth-settings.md.
#
# Required repo secret:
#   SUPABASE_ACCESS_TOKEN   personal access token (supabase.com/dashboard/account/tokens)

on:
  schedule:
    - cron: '17 5 * * 1' # every Monday 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: hosted Auth settings match what the app relies on
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Third-party actions pinned by commit SHA, not a mutable tag (FRESCO-417 / A4-L16).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Read-only job: no push, no authenticated git op after checkout.
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - run: bun install --frozen-lockfile

      - name: Guard — secret present
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::secret SUPABASE_ACCESS_TOKEN is not set"; exit 1; }

      - name: Compare the hosted settings with what the app relies on
        id: check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        # `set -o pipefail` so the step fails on the script's exit (1 = drift, 2 = could not
        # read), not on `tee`'s. An unreadable setting is a failure, never a pass.
        run: |
          set -o pipefail
          bun scripts/check-hosted-auth-settings.ts 2>&1 | tee check-report.txt

      - name: Open or update the drift issue
        # One issue at a time: every red week comments on it instead of stacking new ones.
        if: failure() && steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create hosted-auth-drift --color b60205 --description "Hosted Supabase Auth settings differ from what the app relies on" 2>/dev/null || true
          number=$(gh issue list --label hosted-auth-drift --state open --json number --jq '.[0].number // empty')
          report=$(head -20 check-report.txt)
          if [ -z "$number" ]; then
            body=$(printf '`scripts/check-hosted-auth-settings.ts` found hosted Auth settings that differ from what the app relies on, or could not read them, on [run %s](%s).\n\n```\n%s\n```\n\nFix the setting in the Supabase dashboard (Authentication) or restore access for the token. How to repeat the check by hand: docs/workflows/hosted-auth-settings.md. This issue stays open until a week comes back clean.' \
              "${{ github.run_id }}" "$RUN_URL" "$report")
            gh issue create \
              --title "Hosted Supabase Auth settings differ from what the app relies on" \
              --label hosted-auth-drift \
              --body "$body"
            exit 0
          fi
          gh issue comment "$number" --body "Still red on [run ${{ github.run_id }}]($RUN_URL):"$'\n\n```\n'"$report"$'\n```'

      - name: Close the drift issue once the settings are clean
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for number in $(gh issue list --label hosted-auth-drift --state open --json number --jq '.[].number'); do
            gh issue close "$number" --comment "Clean on [run ${{ github.run_id }}]($RUN_URL): the hosted Auth settings match what the app relies on."
          done
