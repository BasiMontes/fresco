name: spike-supermarket-probe

# FRESCO-760 spike. Manual only: never scheduled, never on push or PR.
# Probes one public page per supermarket from a GitHub-hosted runner to see
# whether datacenter IPs get blocked. See
# scripts/spikes/fresco-760-actions-runner-probe/README.md.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'http (plain fetch) or browser (Playwright)'
        required: true
        default: http
        type: choice
        options:
          - http
          - browser

permissions:
  contents: read

env:
  BUN_VERSION: '1.3.14'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Install Chromium
        if: inputs.mode == 'browser'
        run: bunx playwright install --with-deps chromium
      - name: Probe supermarkets
        run: bun scripts/spikes/fresco-760-actions-runner-probe/probe.ts --mode=${{ inputs.mode }}
