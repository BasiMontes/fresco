name: Stripe e2e (@requiere-stripe-real)

# FRESCO-735 (A5-H5): `@requiere-stripe-real` scenarios in .context/qa/regression.feature
# are fully automated (`tests/steps/suscripcion.steps.ts`, `bun run test:e2e:stripe`) but
# had no CI wiring — coverage depended on a human remembering to run the script by hand
# (last done 2026-08-19). This workflow closes that gap: it is the ONLY thing that changed
# here, no test code or step definitions were touched.
#
# One of the five `@requiere-stripe-real` scenarios ("Acceder a gestión de suscripción")
# is also tagged `@smoke` and already runs on every Production deploy via
# post-deploy-smoke.yml. The remaining four (checkout redirect, trial-without-card session
# read, and the two "payment completed activates Pro" webhook scenarios) create a real
# Stripe test-mode Customer/Subscription each — heavier than a deploy-liveness check, so
# they run here on their own schedule instead of on every deploy.
#
# Target = staging (fresco-pre.vercel.app), not production: same shared Supabase project
# (ADR-0020) and the same STRIPE_SECRET_KEY/STRIPE_PRICE_ID_PRO_MONTH Vercel exposes to
# every Preview deploy (confirmed via `vercel env ls` — one Preview-scoped value, not
# per-branch), so a Checkout Session this job creates by POSTing to staging's own
# `/api/stripe/checkout` route is readable back through the same Stripe account via this
# job's own `stripe` client. Running against staging instead of production keeps this
# health-check off the production deploy's critical path.

on:
  schedule:
    # Weekly, Monday 06:00 UTC — well inside the 6-week staleness window
    # `.context/qa/README.md` documents for `@verificado-manual`, though these scenarios
    # are `@automatizado` and exempt from that clock; the point here is a live guarantee
    # that stays current on its own, not chasing the staleness label.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  stripe-e2e:
    name: test:e2e:stripe
    runs-on: ubuntu-latest
    # Shared with post-deploy-smoke.yml: both hit the same real Supabase project and the
    # same Stripe account, so a queued run waits rather than racing a concurrent smoke run.
    concurrency:
      group: e2e-shared-supabase-backend
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Restore .env from secret
        # Same secret post-deploy-smoke.yml uses — real Supabase + Stripe test-mode creds.
        # No .env.ci overlay here (that overlay carries the DUMMY Stripe creds the main
        # `test:e2e` job needs for its isolated ephemeral stack — the opposite of what this
        # job is for).
        run: printf '%s' "$ENV_FILE" > .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}

      - name: Warm up the staging app
        # Same rationale as post-deploy-smoke.yml's warm-up (FRESCO-322): Vercel's
        # serverless functions spin up lazily on first hit. Best-effort — never fails the
        # job, the suite itself is the real signal.
        continue-on-error: true
        run: |
          for path in / /login /profile; do
            curl -sS -o /dev/null -w "warm app %{http_code} $path (%{time_total}s)\n" --max-time 30 "https://fresco-pre.vercel.app$path" || echo "warm app FAILED $path"
          done

      - name: Run @requiere-stripe-real suite against staging
        run: bun run test:e2e:stripe
        env:
          PLAYWRIGHT_BASE_URL: https://fresco-pre.vercel.app
          # FRESCO-799: staging shares the Supabase project with production, so
          # once its captcha is on, password sign-ins need a token. Sessions come
          # from the admin API instead (tests/session-login.ts).
          E2E_SESSION_LOGIN: '1'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stripe-e2e-playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
