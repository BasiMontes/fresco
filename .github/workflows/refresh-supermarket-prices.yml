name: refresh-supermarket-prices

# FRESCO-770. Runs scripts/refresh-supermarket-prices.ts (ADR-0036): plans the
# supermarket price refresh from the menus' demand and, with `apply`, runs it
# and writes to the shared Supabase project.
#
# Manual only, on purpose. Mercadona now has a live connector (FRESCO-771: the
# community dataset, no request to Mercadona), but Consum does not yet
# (FRESCO-772), and a scheduled run writes to the shared Supabase project, which
# needs the founder's explicit go-ahead. Add a `schedule:` trigger then.
#
# Needs two repository secrets: SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY.
# The service-role key bypasses RLS, so this workflow reads no pull-request
# input and is not triggered by pull requests.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write to the database (off = dry run: print the plan, contact no chain)'
        type: boolean
        default: false
      cargar_catalogos:
        description: 'Initial load of the committed catalogs into the database instead of a refresh'
        type: boolean
        default: false

permissions:
  contents: read

env:
  BUN_VERSION: '1.3.14'

concurrency:
  group: refresh-supermarket-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Run the refresh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APPLY: ${{ inputs.apply }}
          CARGAR_CATALOGOS: ${{ inputs.cargar_catalogos }}
        run: |
          args=()
          if [ "$CARGAR_CATALOGOS" = "true" ]; then args+=(--cargar-catalogos); fi
          if [ "$APPLY" = "true" ]; then args+=(--apply); fi
          bun scripts/refresh-supermarket-prices.ts "${args[@]}"
