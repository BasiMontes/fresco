name: db-backup

# FRESCO-784 (audit-6 A6-D2, ADR-0020). Weekly logical backup of the shared
# Supabase project: pg_dump -> AES-256 encrypt -> prove it restores into a
# throwaway Postgres with matching row counts -> upload to Cloudflare R2.
#
# The upload step only runs if the restore check passed, so every object in the
# bucket is a dump that was actually restored once.
#
# The source database is only READ (pg_dump + count queries), which respects the
# ADR-0020 invariant: no scheduled job writes to the hosted project.
#
# Repository secrets:
#   SUPABASE_DB_PASSWORD database password of the hosted project (already used by
#                        the drift checks). The URL is built from it below, through
#                        the session pooler because GitHub runners are IPv4-only.
#   BACKUP_PASSPHRASE    encrypts the dump; keep a copy OUTSIDE GitHub, or the
#                        backups cannot be opened if the repo is lost
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET
#
# Retention is a lifecycle rule on the bucket (expire objects after 90 days),
# not logic here. Restore procedure: ADR-0020 -> "Backup and restore".

on:
  schedule:
    - cron: '17 3 * * 0' # Sundays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: '1.3.14'
  # Session pooler of the Fresco project (eu-west-1), from supabase/.temp/pooler-url.
  DB_POOLER_HOST: aws-0-eu-west-1.pooler.supabase.com
  DB_PROJECT_REF: jdqemhewjrjuopssdurn

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write # only for the failure notice at the end
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Check R2 access before the long part
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: aws s3 ls "s3://${R2_BUCKET}/" --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" > /dev/null
      - name: Dump, encrypt and verify the restore
        env:
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          encoded="$(printf '%s' "$DB_PASSWORD" | jq -sRr @uri)"
          export SUPABASE_DB_URL="postgresql://postgres.${DB_PROJECT_REF}:${encoded}@${DB_POOLER_HOST}:5432/postgres"
          echo "::add-mask::${SUPABASE_DB_URL}"
          bun scripts/db-backup.ts run --out "$RUNNER_TEMP/fresco-db.dump.enc"
      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          stamp="$(date -u +%Y-%m-%dT%H%M%SZ)"
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp "$RUNNER_TEMP/fresco-db.dump.enc" "s3://${R2_BUCKET}/fresco-db-${stamp}.dump.enc" --endpoint-url "$endpoint"
          aws s3 cp "$RUNNER_TEMP/fresco-db.dump.enc.counts.json" "s3://${R2_BUCKET}/fresco-db-${stamp}.counts.json" --endpoint-url "$endpoint"
      # FRESCO-873: the scheduled run of 2026-10-04 failed and nobody noticed for days.
      # ADR-0020 treats a failed backup as an incident, so a failure opens (or adds to) one
      # GitHub issue instead of relying on someone reading the Actions tab.
      - name: Open an issue when the backup fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="db-backup failed"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"${title}\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Failed again: ${run_url}"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --body "The ${GITHUB_EVENT_NAME} run failed: ${run_url}. Until a run succeeds the newest backup in R2 keeps getting older (ADR-0020, Backup and restore). Close this issue once a run has uploaded a new dump."
          fi
