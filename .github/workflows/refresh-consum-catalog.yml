name: refresh-consum-catalog

# FRESCO-1192. Weekly refresh of lib/grocery/consum-catalog.generated.ts.
# Consum prices stop showing 30 days after the date the file carries (FRESCO-1028), and that date is the day
# the generator read them (FRESCO-1177), so a weekly run keeps them visible. A run changes the date even
# when no price moved, so it normally opens a PR; the body lists every entry that is new, whose product
# changed or that is gone, for a human to review before merging.
#
# Unlike Mercadona (a community dataset), this job calls Consum's storefront itself, under the accepted
# risk of ADR-0037: about 160 searches, two at a time with a pause after each. If too many fail (Consum
# blocked us or changed), the generator stops before it writes, the run fails and an issue is opened; the
# committed catalog stays. To withdraw Consum, disable this workflow too (docs/workflows/supermarket-data-withdrawal.md).
#
# Same hardening as refresh-mercadona-catalog (FRESCO-1017): the checkout keeps no credentials, and the
# personal access token (CATALOG_REFRESH_TOKEN, because a PR opened with GITHUB_TOKEN does not trigger the
# required `pr-check` workflow) reaches only the last step, as an env var.
#
# GitHub runs schedules and workflow_dispatch only from the default branch, so this starts after the
# workflow reaches main.

on:
  schedule:
    - cron: '0 6 * * 3'
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: '1.3.14'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: staging
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # `shell: bash` turns on pipefail, so a generator that stops (too many failed searches) fails the step
      # even though its output is piped through tee.
      - name: Regenerate the catalog from Consum
        shell: bash
        run: bun scripts/gen-consum-catalog.ts | tee "$RUNNER_TEMP/consum-refresh.log"
      # The ingredient dictionary is generated from the catalogs (pack sizes), so it must be regenerated in
      # the same PR or its drift test fails.
      - name: Regenerate the ingredient dictionary
        run: bun scripts/gen-grocery-dictionary.ts
      # The repo's pre-push hook (husky) also runs on the runner, and its agents:compat:check needs the
      # gitignored .claude/skills alias, which only exists after `bun run agents:compat`.
      - name: Link the Claude skills alias
        run: bun run agents:compat
      - name: Open a PR when the catalog changed
        env:
          GH_TOKEN: ${{ secrets.CATALOG_REFRESH_TOKEN }}
        run: |
          files="lib/grocery/consum-catalog.generated.ts lib/grocery/ingredient-dictionary.ts"
          if git diff --quiet -- $files; then
            echo "No changes."
            exit 0
          fi
          open=$(gh pr list --state open --json headRefName \
            -q '[.[] | select(.headRefName | startswith("chore/consum-catalog-refresh-"))] | length')
          if [ "$open" -gt 0 ]; then
            echo "A refresh PR is already open."
            exit 0
          fi
          branch="chore/consum-catalog-refresh-$(date -u +%F)"
          {
            echo "Weekly regeneration of \`lib/grocery/consum-catalog.generated.ts\` and \`lib/grocery/ingredient-dictionary.ts\` from Consum's public storefront (ADR-0037). The file's observation date moves to this run, which is what keeps the prices visible."
            echo
            echo "Review the entries below before merging: \`+\` new, \`~\` the product changed, \`-\` gone. A product that is not the plain ingredient (a dessert, a prepared dish, a pack of several units) is a matcher bug, not something to accept (FRESCO-1193)."
            echo
            echo '```'
            cat "$RUNNER_TEMP/consum-refresh.log"
            echo '```'
            echo
            echo "Jira: FRESCO-1192"
          } > "$RUNNER_TEMP/pr-body.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add $files
          git commit -m "chore(FRESCO-1192): refresh the Consum catalog prices"
          # The checkout kept no credentials, so the push carries the token in the URL. It is not written
          # to .git/config and the step's env is gone when the job ends.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
          # The push above carries no upstream, so gh cannot infer the head branch: name it (FRESCO-1067).
          gh pr create --base staging --head "$branch" \
            --title "chore(FRESCO-1192): refresh the Consum catalog prices" \
            --body-file "$RUNNER_TEMP/pr-body.md"
      # A failed run must be seen: without a refresh the prices disappear 30 days after the last one.
      - name: Open an issue when the refresh failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="refresh-consum-catalog failed"
          open=$(gh issue list --state open --search "$title in:title" --json number -q 'length')
          if [ "$open" -gt 0 ]; then
            echo "An alert issue is already open."
            exit 0
          fi
          gh issue create --title "$title" \
            --body "The weekly Consum refresh failed: ${RUN_URL}. The committed catalog is unchanged. Its prices stop showing 30 days after the date it carries (FRESCO-1028); if Consum blocked the requests, ADR-0037 says to revoke the connector. Jira: FRESCO-1192"
