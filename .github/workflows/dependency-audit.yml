name: Dependency audit

# FRESCO-783 (A6-D1): Dependabot only reports what it can open a PR for, and
# `bun audit` was not run anywhere, so 13 known vulnerabilities (7 high) sat in
# the lockfile unnoticed. This job fails when a high or critical advisory is
# present in `bun.lock`. It is a weekly job rather than a step in `repo:check`
# on purpose: a new advisory against a transitive dependency would otherwise
# turn every unrelated PR red. Run it by hand with `workflow_dispatch`.
#
# FRESCO-1097 (audit 8 A8-DEP-01): the job failed on 2026-10-26 and 2026-11-02
# and nobody reacted, because a red scheduled run notifies no one and Dependabot
# showed zero alerts. A failure now opens (or comments on) ONE issue labelled
# `dependency-audit`, and the first green run closes it.

on:
  schedule:
    - cron: '23 6 * * 1' # Mondays 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: bun audit (high)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Read-only job: no push, no authenticated git op after checkout.
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Fail on high or critical advisories
        id: audit
        # `set -o pipefail` so the step fails on `bun audit`'s exit, not `tee`'s.
        run: |
          set -o pipefail
          bun audit --audit-level=high 2>&1 | tee audit-report.txt

      - name: Open or update the advisories issue
        # One issue at a time: every red week comments on it instead of stacking new ones.
        if: failure() && steps.audit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create dependency-audit --color b60205 --description "bun audit found a high or critical advisory in bun.lock" 2>/dev/null || true
          number=$(gh issue list --label dependency-audit --state open --json number --jq '.[0].number // empty')
          report=$(head -40 audit-report.txt)
          if [ -z "$number" ]; then
            body=$(printf '`bun audit --audit-level=high` found advisories in `bun.lock` on [run %s](%s).\n\n```\n%s\n```\n\nRaise the minimum of the affected package in `package.json` (an `overrides` entry for a transitive one) and run `bun install`. This issue stays open until a week comes back clean.' \
              "${{ github.run_id }}" "$RUN_URL" "$report")
            gh issue create \
              --title "bun audit found a high or critical advisory" \
              --label dependency-audit \
              --body "$body"
            exit 0
          fi
          gh issue comment "$number" --body "Still red on [run ${{ github.run_id }}]($RUN_URL):"$'\n\n```\n'"$report"$'\n```'

      - name: Close the advisories issue once the lockfile is clean
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for number in $(gh issue list --label dependency-audit --state open --json number --jq '.[].number'); do
            gh issue close "$number" --comment "Clean on [run ${{ github.run_id }}]($RUN_URL): no high or critical advisory in the lockfile."
          done
