name: Dependency audit

# FRESCO-783 (A6-D1): Dependabot only reports what it can open a PR for, and
# `bun audit` was not run anywhere, so 13 known vulnerabilities (7 high) sat in
# the lockfile unnoticed. This job fails when a high or critical advisory is
# present in `bun.lock`. It is a weekly job rather than a step in `repo:check`
# on purpose: a new advisory against a transitive dependency would otherwise
# turn every unrelated PR red. Run it by hand with `workflow_dispatch`.

on:
  schedule:
    - cron: '23 6 * * 1' # Mondays 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: bun audit (high)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Fail on high or critical advisories
        run: bun audit --audit-level=high
