name: Drift checks (migration ledger + seed catalog)

# Guards against the repo drifting away from the production project:
#
#   drift-check    `supabase/migrations/` vs the prod migration ledger
#                  (FRESCO-325). Catches the next divergence in days instead
#                  of at the next deploy (how FRESCO-310 found the 54/49 drift).
#
#   seed-drift     `supabase/seed.sql` (a hand-regenerated dump of prod's
#                  recipe catalog) vs prod `public.recipes` (FRESCO-387 /
#                  A4-M13). The e2e suite seeds from this file — if a recipe
#                  was added or removed in prod and the fixture was never
#                  regenerated, CI is testing against a stale catalog.
#
# NEITHER is in pr-check.yml on purpose: both need credentials for the
# production project, and keeping those off the per-PR path is the point of
# ADR-0017. They run on a schedule with their own secrets and open a GitHub
# issue on drift.
#
# FRESCO-413: `drift-check` ALSO runs on `push: [staging]` as a promotion
# gate. On 2026-09-02, six migrations were committed and reached `main` with
# the code but never applied to the prod DB (`get_catalog` missing → /recipes
# empty for every user); the weekly cadence let that sit undetected between
# runs. `staging` is the last hop before the manual `staging -> main`
# fast-forward, so a red `drift-check` on that commit is what a human sees
# before promoting. Same precedent as `test:e2e` running on `push: [staging]`
# (FRESCO-377 / A4-M12): a staging push is not a PR and the promoted squash
# SHA is one the per-PR runs never covered. NOT added to `push: [main]` —
# `main` is a byte-identical ff of the same staging SHA. `seed-drift` stays
# weekly-only: `seed.sql` is never deployed to prod (it only seeds the local
# e2e stack), so a stale fixture is a CI-freshness issue, not a promotion
# risk, and the weekly cadence covers it.
#
# Required repo secrets:
#   SUPABASE_ACCESS_TOKEN   personal access token (supabase.com/dashboard/account/tokens)
#   SUPABASE_DB_PASSWORD    database password for project jdqemhewjrjuopssdurn

on:
  schedule:
    - cron: '23 6 * * 1' # Mondays 06:23 UTC
  workflow_dispatch:
  push:
    branches: [staging]

permissions:
  contents: read
  issues: write

jobs:
  drift-check:
    name: check ledger vs local migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - run: bun install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Guard — secrets present
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          missing=0
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::secret SUPABASE_ACCESS_TOKEN is not set"; missing=1; }
          [ -n "$SUPABASE_DB_PASSWORD" ] || { echo "::error::secret SUPABASE_DB_PASSWORD is not set"; missing=1; }
          [ "$missing" = 0 ] || exit 1

      - name: Link to the production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref jdqemhewjrjuopssdurn

      - name: Check migration ledger drift
        id: drift
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          bun scripts/check-migration-drift.ts | tee drift-report.txt

      - name: Open an issue on drift
        # Only on the scheduled / manual runs — on a `push: [staging]` the red
        # check on the promoted commit IS the signal (a human is right there
        # about to do the `staging -> main` ff), and an issue would just be
        # noise on top of it.
        if: failure() && steps.drift.outcome == 'failure' && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create migration-drift --color b60205 --description "Supabase migration ledger drift" 2>/dev/null || true
          # Dedup: don't stack a new issue every week while one is still open.
          existing=$(gh issue list --label migration-drift --state open --json number --jq 'length')
          if [ "$existing" != "0" ]; then
            echo "An open migration-drift issue already exists — skipping."
            exit 0
          fi
          body=$(printf '`scripts/check-migration-drift.ts` reported drift on run %s.\n\n```\n%s\n```\n\nFix: apply the missing local migrations with `supabase db push`, or recover / `migration repair` the out-of-band entries. See ADR-0017.' \
            "${{ github.run_id }}" "$(cat drift-report.txt)")
          gh issue create \
            --title "Supabase migration ledger has drifted" \
            --label migration-drift \
            --body "$body"

  seed-drift:
    name: check seed.sql vs prod recipe catalog
    runs-on: ubuntu-latest
    # Weekly-only: `seed.sql` seeds the ephemeral local e2e stack, never prod,
    # so a stale fixture is a CI-freshness concern, not a promotion risk
    # (FRESCO-413). The staging-push gate is `drift-check` alone.
    if: github.event_name != 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - run: bun install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Guard — secrets present
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          missing=0
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::secret SUPABASE_ACCESS_TOKEN is not set"; missing=1; }
          [ -n "$SUPABASE_DB_PASSWORD" ] || { echo "::error::secret SUPABASE_DB_PASSWORD is not set"; missing=1; }
          [ "$missing" = 0 ] || exit 1

      - name: Link to the production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref jdqemhewjrjuopssdurn

      - name: Check seed catalog drift
        id: seed
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        # `psql` is preinstalled on ubuntu-latest runners.
        run: bun scripts/check-seed-drift.ts | tee seed-drift-report.txt

      - name: Open an issue on drift
        if: failure() && steps.seed.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create seed-drift --color b60205 --description "supabase/seed.sql vs prod recipe catalog drift" 2>/dev/null || true
          existing=$(gh issue list --label seed-drift --state open --json number --jq 'length')
          if [ "$existing" != "0" ]; then
            echo "An open seed-drift issue already exists — skipping."
            exit 0
          fi
          body=$(printf '`scripts/check-seed-drift.ts` reported drift on run %s.\n\n```\n%s\n```\n\nFix: regenerate `supabase/seed.sql` — see its header comment. The e2e suite seeds from this file (FRESCO-310).' \
            "${{ github.run_id }}" "$(cat seed-drift-report.txt)")
          gh issue create \
            --title "supabase/seed.sql has drifted from the prod catalog" \
            --label seed-drift \
            --body "$body"
