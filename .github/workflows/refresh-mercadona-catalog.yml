name: refresh-mercadona-catalog

# FRESCO-762. Weekly refresh of lib/grocery/mercadona-catalog.generated.ts.
# The community dataset it reads is exported on Mondays, so this runs on
# Tuesday. It opens a PR only when prices actually changed. It uses a personal
# access token (CATALOG_REFRESH_TOKEN) because a PR opened with the default
# GITHUB_TOKEN does not trigger the required `pr-check` workflow.
#
# FRESCO-1017 (audit 7b, A7-SUPPLY-03/05):
#   - The token is NOT persisted in .git/config. `bun install` and the generators run third-party
#     and dataset-derived code, and anything that can read the checkout could read a persisted
#     token. The checkout uses the default read-only GITHUB_TOKEN with persist-credentials: false,
#     and the PAT reaches only the last step, as an env var, to push and open the PR.
#
# FRESCO-1181 (integral review D3):
#   - A failed run opens (or comments on) an issue, like cron-heartbeat-monitor.yml and the Consum
#     refresh. Before, the only signal was GitHub's generic e-mail, and the scheduled runs of 20 and 27
#     October and 3 November failed that way unseen.
#   - A refresh PR that is still open is NOT a success. The run used to exit 0 on it, so one unmerged PR
#     made every following run green while no price moved. It now fails, which raises the same issue.
#   - The commit and the push run with husky off (HUSKY=0). Before, the repo's full pre-push hook ran on
#     the runner and failed the run of 3 November on four pinned price tests; the PR's own required
#     `pr-check` is the gate, and the hook's alias workaround (agents:compat) is gone with it.
#   - The dataset revision is resolved ONCE by the freshness check (the commit SHA of
#     datania/mercadona-catalog) and passed to the generator, so the check and the download read the
#     same revision. The PR body names it so the reviewer can open exactly that tree.

on:
  schedule:
    - cron: '0 6 * * 2'
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: '1.3.14'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: staging
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Check the dataset is fresh and resolve its revision
        id: freshness
        run: bun scripts/check-mercadona-dataset-freshness.ts
      - name: Regenerate the catalog from that revision
        env:
          MERCADONA_DATASET_REVISION: ${{ steps.freshness.outputs.revision }}
        run: bun scripts/gen-mercadona-catalog.ts
      # The ingredient dictionary is generated from the catalog (pack sizes), so
      # it must be regenerated in the same PR or its drift test fails.
      - name: Regenerate the ingredient dictionary
        run: bun scripts/gen-grocery-dictionary.ts
      - name: Open a PR when prices changed
        env:
          GH_TOKEN: ${{ secrets.CATALOG_REFRESH_TOKEN }}
          DATASET_REVISION: ${{ steps.freshness.outputs.revision }}
          # FRESCO-1181: the commit and the push below must not run the repo's full husky hooks on the runner.
          HUSKY: '0'
        run: |
          files="lib/grocery/mercadona-catalog.generated.ts lib/grocery/ingredient-dictionary.ts"
          if git diff --quiet -- $files; then
            echo "No price changes."
            exit 0
          fi
          open=$(gh pr list --state open --json headRefName \
            -q '[.[] | select(.headRefName | startswith("chore/mercadona-catalog-refresh-"))] | length')
          if [ "$open" -gt 0 ]; then
            # FRESCO-1181: not a success. A refresh PR nobody merged would otherwise block every run in silence.
            echo "::error::A refresh PR is already open, so this run changed nothing. Merge or close it."
            echo "A refresh PR is already open."
            exit 1
          fi
          branch="chore/mercadona-catalog-refresh-$(date -u +%F)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add $files
          git commit -m "chore(FRESCO-762): refresh the Mercadona catalog prices"
          # The checkout kept no credentials, so the push carries the token in the URL. It is not written
          # to .git/config and the step's env is gone when the job ends.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
          # The push above carries no upstream, so gh cannot infer the head branch: name it (FRESCO-1067).
          gh pr create --base staging --head "$branch" \
            --title "chore(FRESCO-762): refresh the Mercadona catalog prices" \
            --body "Weekly regeneration of \`lib/grocery/mercadona-catalog.generated.ts\` and \`lib/grocery/ingredient-dictionary.ts\` from the community dataset, read at the pinned revision \`${DATASET_REVISION}\` (https://huggingface.co/datasets/datania/mercadona-catalog/tree/${DATASET_REVISION}). Jira: FRESCO-762"
      # A failed or blocked run must be seen (FRESCO-1181): without a merged refresh the prices stay as they were.
      - name: Open or update an issue when the refresh failed or was blocked
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="refresh-mercadona-catalog needs attention"
          body="The weekly Mercadona refresh failed or was blocked by a refresh PR that is still open: ${RUN_URL}. Prices only reach production after the refresh PR is merged and the next promotion to main. Jira: FRESCO-1181"
          number=$(gh issue list --state open --search "$title in:title" --json number -q '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
            exit 0
          fi
          gh issue create --title "$title" --body "$body"
