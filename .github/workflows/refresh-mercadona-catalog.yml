name: refresh-mercadona-catalog

# FRESCO-762. Weekly refresh of lib/grocery/mercadona-catalog.generated.ts.
# The community dataset it reads is exported on Mondays, so this runs on
# Tuesday. It opens a PR only when prices actually changed. It uses a personal
# access token (CATALOG_REFRESH_TOKEN) because a PR opened with the default
# GITHUB_TOKEN does not trigger the required `pr-check` workflow.

on:
  schedule:
    - cron: '0 6 * * 2'
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: '1.3.14'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: staging
          token: ${{ secrets.CATALOG_REFRESH_TOKEN }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Check the dataset is fresh
        run: bun scripts/check-mercadona-dataset-freshness.ts
      - name: Regenerate the catalog
        run: bun scripts/gen-mercadona-catalog.ts
      # The repo's pre-push hook (husky) also runs on the runner, and its
      # agents:compat:check needs the gitignored .claude/skills alias, which
      # only exists after this generator has run.
      - name: Link the Claude skills alias
        run: bun run agents:compat
      - name: Open a PR when prices changed
        env:
          GH_TOKEN: ${{ secrets.CATALOG_REFRESH_TOKEN }}
        run: |
          if git diff --quiet -- lib/grocery/mercadona-catalog.generated.ts; then
            echo "No price changes."
            exit 0
          fi
          open=$(gh pr list --state open --json headRefName \
            -q '[.[] | select(.headRefName | startswith("chore/mercadona-catalog-refresh-"))] | length')
          if [ "$open" -gt 0 ]; then
            echo "A refresh PR is already open."
            exit 0
          fi
          branch="chore/mercadona-catalog-refresh-$(date -u +%F)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add lib/grocery/mercadona-catalog.generated.ts
          git commit -m "chore(FRESCO-762): refresh the Mercadona catalog prices"
          git push origin "$branch"
          gh pr create --base staging \
            --title "chore(FRESCO-762): refresh the Mercadona catalog prices" \
            --body "Weekly regeneration of \`lib/grocery/mercadona-catalog.generated.ts\` from the community dataset. Jira: FRESCO-762"
