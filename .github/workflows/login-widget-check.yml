name: Login widget check (Turnstile on /login)

# FRESCO-1016 (audit 7b A7-TEST-06): nothing else renders the Turnstile widget. The CI stack has no captcha, the
# e2e job blanks the site key (FRESCO-799) and the post-deploy smoke gets its session from the admin API. A wrong
# site key, a Content-Security-Policy that blocks Cloudflare or a captcha misconfiguration would lock every user
# out of /login and /signup with every other gate green.
#
# Once a day it loads the real /login of staging in Chromium (no credentials, nothing written) and fails unless
# the widget rendered (`scripts/check-login-widget.ts`). One issue is opened (later failures comment on it) and
# closed when the widget is back. GitHub schedules are best-effort: this is a backup, not a primary alert.
#
# Run it by hand with another URL (workflow_dispatch input `url`) to check production before a launch.

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      url:
        description: 'Base URL to check. Defaults to staging (`environments.staging.web_url` in .agents/project.yaml).'
        required: false
        default: 'https://fresco-pre.vercel.app'

permissions:
  contents: read
  issues: write

concurrency:
  group: login-widget-check
  cancel-in-progress: false

env:
  BUN_VERSION: '1.3.14'

jobs:
  widget:
    name: Turnstile widget on /login
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      LOGIN_WIDGET_URL: ${{ inputs.url || 'https://fresco-pre.vercel.app' }}
      LABEL: login-widget-failure
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Check that the widget renders
        id: check
        run: |
          set -o pipefail
          bun scripts/check-login-widget.ts "$LOGIN_WIDGET_URL" 2>&1 | tee widget-check.log

      - name: Open or update the issue
        if: failure()
        run: |
          gh label create "$LABEL" --color b60205 --description "Turnstile widget did not render on /login" 2>/dev/null || true
          existing=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty')
          detail=$(tail -n 20 widget-check.log 2>/dev/null || echo "no log")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing: $RUN_URL"
            exit 0
          fi
          gh issue create \
            --title "The Turnstile widget does not render on /login" \
            --label "$LABEL" \
            --body "$(printf 'The daily check could not see the Turnstile widget on %s/login. Run: %s\n\n```\n%s\n```\n\nWhat to check first: NEXT_PUBLIC_TURNSTILE_SITE_KEY in the Vercel scope of that environment, the Content-Security-Policy in proxy.ts (script-src, frame-src, connect-src for challenges.cloudflare.com), and the Turnstile site in the Cloudflare dashboard.' "$LOGIN_WIDGET_URL" "$RUN_URL" "$detail")"

      - name: Close the issue when it is back
        if: success()
        run: |
          existing=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "The widget renders again: $RUN_URL"
          fi
