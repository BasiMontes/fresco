name: Edge functions (auto-deploy + drift check)

# Sibling of migration-drift-check.yml (FRESCO-413), for the Edge Functions
# layer. The audit-4 ola-3 sweep promoted `supabase/functions/*` code to `main`
# without redeploying it — `reassign-guest-data` served the exploitable v19 for
# ~24h after its ticket was closed (FRESCO-414). Nothing detected it, and the
# weekly-only cadence of the migration check would have let a function drift sit
# for days.
#
#   deploy        on `push: [staging]` only. Redeploys the functions that
#                 changed in the pushed range (all of them when
#                 `_shared/**` / `deno.json` changed). `staging` is the last hop
#                 before the manual `staging -> main` fast-forward, so after this
#                 job `main` can never carry undeployed function code. This is
#                 the FRESCO-414 root-cause fix, not just detection.
#
#   drift-check   always. Compares `supabase/functions/*` against the deployed
#                 versions (git-mtime heuristic — the deployed bundle hash is not
#                 locally recomputable). On `push` it runs after `deploy` and a
#                 red check on the promoted commit is the signal a human sees
#                 before the ff. On the weekly schedule it opens a GitHub issue.
#
# NOT in pr-check.yml on purpose: `supabase functions list` / `deploy` need the
# production access token and the per-PR path must not carry it (ADR-0017). Same
# precedent as migration-drift-check.yml running on `push: [staging]`.
#
# Required repo secret:
#   SUPABASE_ACCESS_TOKEN   personal access token (supabase.com/dashboard/account/tokens)
#                           — already present from FRESCO-413.

on:
  schedule:
    - cron: '47 6 * * 1' # Mondays 06:47 UTC (offset from migration-drift-check)
  workflow_dispatch:
  push:
    branches: [staging]

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    name: deploy changed functions
    # Push-only: a scheduled run that deploys would be surprising. On the
    # schedule, drift-check alone runs and opens an issue.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # A redeploy mutates the shared Supabase project (jdqemhewjrjuopssdurn),
    # which the e2e suite runs against. Reuse pr-check.yml's / post-deploy-smoke's
    # concurrency group so a function is never redeployed mid-e2e-run.
    concurrency:
      group: e2e-shared-supabase-backend
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # deploy-changed-functions.ts diffs github.event.before..github.sha to
          # decide which functions changed — needs full history.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - run: bun install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Guard — secret present
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::secret SUPABASE_ACCESS_TOKEN is not set"; exit 1; }

      - name: Deploy the functions that changed
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: bun scripts/deploy-changed-functions.ts

  drift-check:
    name: check repo vs deployed
    needs: [deploy]
    # Runs even when `deploy` is skipped (the weekly schedule) — `always()` plus
    # a skipped `needs` dependency still executes.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check-functions-drift.ts reads `git log` timestamps per function dir.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - run: bun install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Guard — secret present
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::secret SUPABASE_ACCESS_TOKEN is not set"; exit 1; }

      - name: Check edge-function drift
        id: drift
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # pipefail — without it the pipeline exits with `tee`'s status (0) and
          # a real drift (script exits 1) would leave this step green. Exact bug
          # fixed in FRESCO-413 for the migration check.
          set -o pipefail
          bun scripts/check-functions-drift.ts | tee functions-drift-report.txt

      - name: Open an issue on drift
        # Schedule / manual only. On a `push` the red check on the promoted
        # commit IS the signal (a human is about to do the ff), and the deploy
        # job above should have already fixed it — an issue would be noise.
        if: failure() && steps.drift.outcome == 'failure' && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create function-drift --color b60205 --description "Supabase edge functions repo vs deployed drift" 2>/dev/null || true
          existing=$(gh issue list --label function-drift --state open --json number --jq 'length')
          if [ "$existing" != "0" ]; then
            echo "An open function-drift issue already exists — skipping."
            exit 0
          fi
          body=$(printf '`scripts/check-functions-drift.ts` reported drift on run %s.\n\n```\n%s\n```\n\nFix: `bun scripts/deploy-changed-functions.ts` against the linked project, or deploy the flagged functions by hand. See supabase/functions/README.md.' \
            "${{ github.run_id }}" "$(cat functions-drift-report.txt)")
          gh issue create \
            --title "Supabase edge functions have drifted from the repo" \
            --label function-drift \
            --body "$body"
