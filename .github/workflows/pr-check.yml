name: PR Check

on:
  pull_request:
    branches: [dev, staging, main]
  # The dev -> staging -> main promotion is a manual fast-forward `git push`,
  # never a PR, so `pull_request` alone leaves the exact commit Vercel
  # deploys to staging / production ungated. `push` runs the fast,
  # secret-free jobs (repo-check + unit) on that commit.
  #
  # FRESCO-377 (A4-M12): `e2e` ALSO runs on push to `staging` (the `if:`
  # guard on the job). The commit that lands on `dev` is a NEW squash SHA
  # the PR run never executed e2e against; `staging` is the last hop before
  # the `staging -> main` ff, so gating that SHA here is what makes "the
  # promoted commit passed e2e" true. It is NOT added to push:[main] -
  # `main` is a byte-identical ff of the same staging SHA, so a second run
  # would only burn ~4 min. (Supersedes the FRESCO-311 decision to keep
  # e2e PR-only.)
  push:
    branches: [staging, main]

env:
  BUN_VERSION: '1.3.14'
  SUPABASE_CLI_VERSION: '2.109.1'
  DENO_VERSION: '2.9.6'

jobs:
  repo-check:
    name: repo:check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # FRESCO-357: cache bun's global install cache + node_modules keyed on
      # the lockfile. `bun install` still runs (to validate --frozen-lockfile
      # and link), but against a warm cache it is near-instant.
      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-deps-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install --frozen-lockfile

      - run: bun run repo:check

  unit:
    name: test:unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-deps-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install --frozen-lockfile

      - run: bun test

  deno:
    name: deno:check
    runs-on: ubuntu-latest
    # FRESCO-375 (A4-H4): supabase/functions/ is excluded from the app's tsc
    # and ESLint, so `repo:check` green never meant the Edge Functions
    # compile. This job type-checks (`deno check`) and lints (`deno lint`)
    # them with Deno 2 (matches `deno_version = 2` in supabase/config.toml).
    # Config + import map: supabase/functions/deno.json. No secrets, no
    # node_modules, no Supabase stack - runs on `push` too (FRESCO-311).
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      # Cache Deno's resolved npm/remote deps keyed on the import map.
      - name: Cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('supabase/functions/deno.lock', 'supabase/functions/deno.json') }}

      - name: deno lint
        working-directory: supabase/functions
        run: deno lint

      - name: deno check
        working-directory: supabase/functions
        run: deno check "**/*.ts"

  e2e:
    name: test:e2e
    runs-on: ubuntu-latest
    needs: repo-check
    # Runs on every PR, AND on push to `staging` (FRESCO-377 / A4-M12): the
    # squash SHA that lands on `dev` and mirrors to `staging`/`main` is a
    # commit the PR run never executed e2e against, and `strict: false`
    # branch protection lets a stale PR branch merge. `staging` is the last
    # hop before the `staging -> main` ff, so its e2e run is the gate on the
    # exact commit that reaches production. NOT run on push to `main` - that
    # is a byte-identical ff of the same staging SHA. e2e needs
    # secrets.ENV_FILE + a full ephemeral local Supabase stack (FRESCO-310),
    # so it stays off the other push targets. A skipped job with
    # `needs: repo-check` does not fail the run.
    if: >-
      github.event_name == 'pull_request'
      || (github.event_name == 'push' && github.ref == 'refs/heads/staging')
    # FRESCO-357 (follow-up of FRESCO-289): the `e2e-shared-supabase-backend`
    # concurrency group is gone from this job. It only ever existed because
    # PR e2e runs used to mutate the shared production Supabase project; as
    # of FRESCO-310 each run boots its OWN ephemeral local stack, so parallel
    # PR runs are fully isolated. `post-deploy-smoke.yml` keeps the group -
    # it still runs @smoke against the real prod backend.
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-deps-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install --frozen-lockfile

      # FRESCO-357: cache the downloaded Playwright browser binaries
      # (~/.cache/ms-playwright, ~150MB) keyed on the resolved @playwright/test
      # version. On a hit, `playwright install` only re-checks the apt system
      # deps (fast); on a miss it downloads chromium as before.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            bunx playwright install-deps chromium
          else
            bunx playwright install --with-deps chromium
          fi

      # FRESCO-357: cache the Next.js build compilation cache. Paired with the
      # background-build step below (which overlaps `bun run build` with the
      # Supabase stack bring-up), a warm `.next/cache` keeps the build fully
      # hidden behind the ~2 min of stack setup - the "Wait for the background
      # build" step then costs ~12 s instead of a ~60-90 s sequential build.
      # The key is over the lockfile + a hash of every source file, so any
      # real change busts it; `restore-keys` still gives a partial (per-file
      # incremental) hit when only some files changed. Manual bust: bump `v1`.
      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextcache-v1-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx', '!node_modules/**', '!.next/**') }}
          restore-keys: |
            nextcache-v1-${{ runner.os }}-${{ hashFiles('bun.lock') }}-

      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      # FRESCO-357: a `docker save`/`docker load` cache of the Supabase
      # local-stack images (~1 GB) was tried and removed - measured net zero.
      # The `docker load` of the tarball (~70 s) plus its cache download
      # (~17 s) costs as much as the fresh `ghcr.io` pull it replaces (the
      # GitHub-hosted runners have fast registry egress). `supabase start`
      # pulls the images itself on every run - left as-is.
      - name: Restore .env from secret and apply CI overlay
        # `test:e2e` re-sources `.env` itself
        # (`bash -c 'set -a; . ./.env; set +a; ...'`), so the local-stack
        # overrides must live IN `.env`. `.env.ci` (committed - Supabase's
        # public local-dev demo constants) is appended last so its
        # NEXT_PUBLIC_SUPABASE_URL / SUPABASE_* / *_USER_* values win over the
        # production ones in the restored secret.
        run: |
          printf '%s\n' "$ENV_FILE" > .env
          cat .env.ci >> .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}

      # FRESCO-357: `bun run build` does not need the database - kick it off
      # in the background now and let it overlap the Supabase stack bring-up
      # (start + reset + seed), then `wait` for it before starting the server.
      # Turns the sum of the two into roughly the max.
      - name: Build the app (background, overlaps the stack setup)
        run: |
          set -a; . ./.env; set +a
          rm -f "$RUNNER_TEMP/build.exit"
          nohup bash -c "bun run build > '$RUNNER_TEMP/build.log' 2>&1; echo \$? > '$RUNNER_TEMP/build.exit'" >/dev/null 2>&1 &

      - name: Start local Supabase
        # Serves Postgres, Auth (GoTrue), PostgREST and the Edge Runtime on
        # 127.0.0.1 - zero production credentials in play.
        # FRESCO-357: `-x` skips the containers the e2e suite never touches
        # (Realtime, Storage, imgproxy, Studio, Inbucket, Logflare, Vector) -
        # `supabase start` was the single biggest step (~90 s) and none of
        # these are on any tested path (no storage/realtime refs in tests/,
        # recipe photos are external URLs, email confirmations are off).
        run: supabase start -x realtime,storage-api,imgproxy,studio,inbucket,logflare,vector

      - name: Apply migrations + seed
        # `supabase db reset` drops the database, re-runs every migration from
        # empty, then loads supabase/seed.sql (recipe catalog + rate-limit
        # exemption rows). Any migration or seed failure fails the job here -
        # also the only CI coverage that the migrations still apply cleanly
        # from scratch.
        run: supabase db reset

      - name: SQL tests (pgTAP)
        # Runs supabase/tests/*.sql against the freshly-reset local stack via
        # pg_prove. Currently: recipe_learning_trigger.test.sql (FRESCO-381 -
        # the rating-average-denominator regression). Reuses the stack that is
        # already up; no extra services, no secrets.
        run: supabase test db

      - name: Seed e2e users
        # Creates the two fixed accounts the suite logs in as
        # (DEV_USER_* / PRO_USER_*) against the local GoTrue admin API. The
        # script hard-refuses any non-localhost SUPABASE_URL.
        run: bun scripts/seed-e2e-users.ts

      - name: Assert e2e is isolated from the prod Supabase project
        # Last line of defence: if any Supabase var still points at a hosted
        # project, fail loudly here rather than silently mutating production.
        run: |
          set -a; . ./.env; set +a
          fail=0
          for v in NEXT_PUBLIC_SUPABASE_URL SUPABASE_URL NEXT_PUBLIC_SUPABASE_FUNCTIONS_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY; do
            val="${!v}"
            case "$val" in
              *jdqemhewjrjuopssdurn*|*supabase.co*|*supabase.in*)
                echo "::error::$v points at a hosted Supabase project: $val"; fail=1;;
            esac
          done
          case "$NEXT_PUBLIC_SUPABASE_URL" in
            http://127.0.0.1:54321*|http://localhost:54321*) ;;
            *) echo "::error::NEXT_PUBLIC_SUPABASE_URL is not the local stack: $NEXT_PUBLIC_SUPABASE_URL"; fail=1;;
          esac
          [ "$fail" = 0 ] || { echo "e2e is NOT isolated from production - aborting"; exit 1; }
          echo "OK: e2e backend is the local stack"

      - name: Wait for the background build + start the production server
        # `next dev` compiles each route on first hit - on-demand latency blew
        # past the per-test timeouts in CI. A pre-compiled production build
        # removes that variable. (FRESCO-266). The build runs in a separate
        # step's shell, so this polls for its sentinel file rather than
        # `wait`-ing on a PID it doesn't own.
        run: |
          set -a; . ./.env; set +a
          for _ in $(seq 1 180); do
            [ -f "$RUNNER_TEMP/build.exit" ] && break
            sleep 2
          done
          ec=$(cat "$RUNNER_TEMP/build.exit" 2>/dev/null || echo "timeout")
          if [ "$ec" != "0" ]; then
            echo "::error::bun run build did not finish cleanly ($ec)"
            cat "$RUNNER_TEMP/build.log" || true
            exit 1
          fi
          cat "$RUNNER_TEMP/build.log"
          bun run start &
          npx --yes wait-on http://localhost:3000 --timeout 60000

      - run: bun run test:e2e

      - name: Upload Playwright report + traces
        # FRESCO-387 (A4-M14): `retries: 1` + `trace: 'on-first-retry'` produce
        # a trace zip under `test-results/` on the retried failure — keep it
        # (and the html/blob reports) so a flaky CI failure is debuggable.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            blob-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop Supabase
        if: always()
        run: supabase stop
