name: PR Check

on:
  pull_request:
    branches: [dev, staging, main]
  # The dev -> staging -> main promotion is a manual fast-forward `git push`,
  # never a PR, so `pull_request` alone leaves the exact commit Vercel
  # deploys to staging / production ungated. `push` runs the fast,
  # secret-free jobs (repo-check + unit) on that commit. The `e2e` job stays
  # PR-only via an `if:` guard below — it needs secrets.ENV_FILE and the
  # shared-backend concurrency dance, neither of which belongs on a
  # post-merge push. (FRESCO-311)
  push:
    branches: [staging, main]

jobs:
  repo-check:
    name: repo:check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - run: bun install --frozen-lockfile

      - run: bun run repo:check

  unit:
    name: test:unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - run: bun install --frozen-lockfile

      - run: bun test

  e2e:
    name: test:e2e
    runs-on: ubuntu-latest
    needs: repo-check
    # PR-only: `push` runs (staging / main promotion) skip e2e entirely.
    # e2e needs secrets.ENV_FILE and serializes on the shared Supabase
    # backend — running it again post-merge adds latency and shared-state
    # churn without gating anything the pre-merge PR run did not already
    # gate. A skipped job with `needs: repo-check` does not fail the run.
    if: github.event_name == 'pull_request'
    # All PRs' e2e runs share the same single Supabase backend
    # (jdqemhewjrjuopssdurn) via secrets.ENV_FILE — there is no per-PR or
    # ephemeral backend. Concurrent runs mutate the same rows (e.g.
    # reseedCurrentWeekPlan() deletes+regenerates the QA user's meal_plans;
    # @suscripcion steps do service-role writes to user_profiles.plan),
    # so two overlapping PR runs race on shared state. `workers: 1` in
    # playwright.config.ts only serializes tests *within* one run — it does
    # nothing for two *different* CI jobs running at the same time.
    # This group is a single fixed string (not scoped to ref/PR), so every
    # e2e job across every PR queues behind the previous one instead of
    # running concurrently. cancel-in-progress stays false: a queued run
    # should wait, never cancel a run that's mid-mutation against the
    # shared backend (that would leave it half-seeded for the next run).
    # This is a stopgap (FRESCO-289) — the real fix is per-run test
    # factories or an ephemeral Supabase project, tracked as a follow-up.
    concurrency:
      group: e2e-shared-supabase-backend
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Restore .env from secret
        run: printf '%s' "$ENV_FILE" > .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}

      - name: Build and start production server
        # `next dev` compiles each route on first hit — combined with real
        # network round-trips that on-demand latency blew past the 90s
        # per-test and 5s assertion timeouts in CI (never an issue locally
        # against an already-warm server). A pre-compiled production build
        # removes that variable. (FRESCO-266)
        run: |
          set -a; . ./.env; set +a
          bun run build
          bun run start &
          npx --yes wait-on http://localhost:3000 --timeout 60000

      - run: bun run test:e2e
