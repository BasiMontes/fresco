name: PR Check

on:
  pull_request:
    branches: [dev, staging, main]

jobs:
  repo-check:
    name: repo:check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - run: bun install --frozen-lockfile

      - name: Restore .env from secret
        run: printf '%s' "$ENV_FILE" > .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}

      - name: Run repo:check
        run: |
          set -a; . ./.env; set +a
          bun run repo:check

  e2e:
    name: test:e2e
    runs-on: ubuntu-latest
    needs: repo-check
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Restore .env from secret
        run: printf '%s' "$ENV_FILE" > .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}

      - name: Build and start production server
        # next dev compiles each route on first hit -- combined with real
        # network round-trips (Gemini, Supabase), that on-demand compile
        # latency blew past both the 90s per-test and 5s assertion timeouts
        # in CI (never an issue locally against an already-warm dev server).
        # A pre-compiled production build removes that variable entirely.
        run: |
          set -a; . ./.env; set +a
          bun run build
          bun run start &
          npx --yes wait-on http://localhost:3000 --timeout 60000

      - run: bun run test:e2e
