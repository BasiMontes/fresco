name: PR Check

on:
  pull_request:
    branches: [dev, staging, main]

jobs:
  repo-check:
    name: repo:check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - run: bun install --frozen-lockfile

      - run: bun run repo:check

  unit:
    name: test:unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - run: bun install --frozen-lockfile

      - run: bun test

  e2e:
    # Informational until `secrets.ENV_FILE` is updated to the renamed
    # {DEV,PRE,PRO}_USER_* test-user keys (currently still LOCAL_USER_* /
    # PRO_TEST_USER_*). Once the secret is fixed, drop `continue-on-error`
    # and add this to the branch's required checks. (FRESCO-266)
    name: test:e2e (informational)
    runs-on: ubuntu-latest
    needs: repo-check
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Restore .env from secret
        run: printf '%s' "$ENV_FILE" > .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}

      - name: Build and start production server
        # `next dev` compiles each route on first hit — combined with real
        # network round-trips that on-demand latency blew past the 90s
        # per-test and 5s assertion timeouts in CI (never an issue locally
        # against an already-warm server). A pre-compiled production build
        # removes that variable. (FRESCO-266)
        run: |
          set -a; . ./.env; set +a
          bun run build
          bun run start &
          npx --yes wait-on http://localhost:3000 --timeout 60000

      - run: bun run test:e2e
