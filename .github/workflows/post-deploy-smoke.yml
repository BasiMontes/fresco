name: Post-Deploy Smoke

# Runs a tiny @smoke subset of the e2e suite against the PRODUCTION
# deployment the moment Vercel reports it live. Complements pr-check.yml:
# that gate proves the commit builds and its tests pass in CI; this proves
# the *deployed production artifact* actually serves the core happy paths
# (auth, menu generation, shopping list, subscription management, the
# public /qa page).
#
# Scope = Production deploys only (see the job `if:`). Vercel's GitHub
# deployment payload only distinguishes "Preview" vs "Production" — it does
# NOT tell a staging-branch preview apart from a PR-branch preview (`ref` is
# the commit SHA, `payload` is empty), so a per-branch staging filter is not
# possible here. Every dev -> staging -> main promotion is a fast-forward of
# the same commit, so the Production run covers the exact code staging ran.
#
# `deployment_status` workflows run from the workflow file on the branch
# that owns the deployed commit (observed: this fired from the PR branch
# before merge), so it keeps working once merged to main.
#
# Non-blocking: no required status check is wired to this job, and
# `deployment_status` fires AFTER the deploy is already live, so it cannot
# gate the promotion. A red smoke run is a signal to investigate / roll
# back (`vercel rollback`), not an automatic stop. (FRESCO-311)

on:
  deployment_status:

permissions:
  contents: read

jobs:
  smoke:
    name: smoke (@smoke)
    # Vercel posts several deployment_status updates per deploy (pending,
    # in_progress, success, and sometimes error). Only act on the terminal
    # success of a PRODUCTION deploy. Preview deploys (PR branches, dev,
    # staging) are already covered by the full @automatizado e2e suite in
    # pr-check.yml and would only add noise + shared-backend contention.
    # `inactive` (Vercel "skipped - not affected") is not covered either:
    # nothing new was deployed.
    # Vercel names the env "Production" (bare) here; startsWith() also covers
    # the "Production - <project>" form Vercel uses when a project slug is set.
    if: >-
      github.event.deployment_status.state == 'success'
      && startsWith(github.event.deployment_status.environment, 'Production')
    runs-on: ubuntu-latest
    # Same shared single Supabase backend (jdqemhewjrjuopssdurn) as the e2e
    # job in pr-check.yml. Reuse that job's concurrency group so this run and
    # a concurrent PR e2e run never mutate the shared rows at the same time.
    # cancel-in-progress: false — a queued run waits; it never cancels a run
    # mid-mutation. (A pending smoke run CAN still be superseded by a newer
    # request in the group; that is acceptable for a non-blocking check.)
    concurrency:
      group: e2e-shared-supabase-backend
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Restore .env from secret
        # The @smoke scenarios log in as the DEV/PRO test users and create
        # throwaway factory users — all of which need the Supabase + Stripe
        # creds that live in secrets.ENV_FILE (same secret pr-check.yml's
        # e2e job uses).
        run: printf '%s' "$ENV_FILE" > .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}

      - name: Report target
        run: |
          echo "Deployment environment: ${{ github.event.deployment_status.environment }}"
          echo "Target URL: ${{ github.event.deployment_status.target_url }}"
          echo "Environment URL: ${{ github.event.deployment_status.environment_url }}"

      - name: Run @smoke suite against the deployed URL
        # playwright.config.ts reads PLAYWRIGHT_BASE_URL and points the whole
        # suite at it. Vercel's deployment_status payload carries the
        # immutable deployment URL in target_url, with environment_url as the
        # documented fallback when target_url is empty. Do NOT use the
        # fresco-pre / fresco-pro aliases here - fresco-pre in particular
        # gets silently reclaimed onto the production deploy (see
        # .agents/project.yaml). The deployment's own URL is the only
        # reliable target.
        run: bun run test:e2e:smoke
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event.deployment_status.target_url || github.event.deployment_status.environment_url }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
