name: lcp-budget

# FRESCO-751. Manual only: measures the real mobile LCP of a deployed URL under
# applied slow-4G + 4x CPU throttling, cold on every run, and fails when the
# median exceeds the budget. See scripts/measure-lcp.ts for why this is used
# instead of Lighthouse's simulated throttling.

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Page to measure'
        required: true
        default: 'https://fresco-pro.vercel.app/'
        type: string
      runs:
        description: 'Cold runs (the median is compared with the budget)'
        required: true
        default: '5'
        type: string
      budget:
        description: 'LCP budget in ms'
        required: true
        default: '2500'
        type: string

permissions:
  contents: read

env:
  BUN_VERSION: '1.3.14'

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Measure LCP
        env:
          URL: ${{ inputs.url }}
          RUNS: ${{ inputs.runs }}
          BUDGET: ${{ inputs.budget }}
        run: bun scripts/measure-lcp.ts --url="$URL" --runs="$RUNS" --budget="$BUDGET"
