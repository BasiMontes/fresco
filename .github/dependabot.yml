# Keeps the SHA-pinned GitHub Actions (FRESCO-399 / FRESCO-417) fresh: Dependabot
# opens a PR when a pinned action publishes a new release, bumping the SHA and the
# trailing `# vX.Y.Z` comment together. Without this, a pin silently goes stale.
#
# FRESCO-731: github-actions alone left real runtime dependencies (npm/bun)
# unwatched. Dependabot supports the bun ecosystem via the text-based
# `bun.lock` lockfile (bun >= 1.1.39, which this repo already produces) —
# https://docs.github.com/en/code-security/reference/supply-chain-security/supported-ecosystems-and-repositories#bun
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # dev is the integration branch (dev -> staging -> main); PRs to main
    # bypass that flow. Default target is the repo default branch, so pin it.
    target-branch: staging
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
  - package-ecosystem: bun
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
      day: monday
    # FRESCO-783: one catch-all group let a single failing major bump close the
    # whole PR (#403 lasted 49 minutes), taking every safe patch with it. Majors
    # get their own PR; minor/patch stay batched.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      major:
        update-types: [major]
    commit-message:
      prefix: chore
