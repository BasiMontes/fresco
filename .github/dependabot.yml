# Keeps the SHA-pinned GitHub Actions (FRESCO-399 / FRESCO-417) fresh: Dependabot
# opens a PR when a pinned action publishes a new release, bumping the SHA and the
# trailing `# vX.Y.Z` comment together. Without this, a pin silently goes stale.
#
# FRESCO-731: github-actions alone left real runtime dependencies (npm/bun)
# unwatched. Dependabot supports the bun ecosystem via the text-based
# `bun.lock` lockfile (bun >= 1.1.39, which this repo already produces) —
# https://docs.github.com/en/code-security/reference/supply-chain-security/supported-ecosystems-and-repositories#bun
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # dev is the integration branch (dev -> staging -> main); PRs to main
    # bypass that flow. Default target is the repo default branch, so pin it.
    target-branch: staging
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
  - package-ecosystem: bun
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
      day: monday
    # FRESCO-783: one catch-all group let a single failing major bump close the
    # whole PR (#403 lasted 49 minutes), taking every safe patch with it. Majors
    # get their own PR; minor/patch stay batched.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      major:
        update-types: [major]
    # FRESCO-924: TypeScript 7 is the native compiler and has no JavaScript API.
    # PR #495 (typescript 6.0.3 to 7.0.2) failed on exactly that: typescript-eslint
    # refuses TS 7 ("does not support TS 7.0") and scripts/check-import-cycles.ts
    # calls ts.readConfigFile, which no longer exists. Skip the major until
    # typescript-eslint supports it and the cycles script no longer needs the
    # compiler API; minor and patch releases still come through.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # FRESCO-964: varlock's version is pinned in the MCP env loaders (.mcp.json,
      # cli/lib/agent-compatibility-contracts.ts, docs/mcp/*) and a test requires
      # it to equal the package.json version. PR #680 bumped only package.json and
      # failed that test. Those files are synced from upstream, so the bump arrives
      # with `bun sync` together with its pin, not from Dependabot.
      - dependency-name: varlock
    commit-message:
      prefix: chore
