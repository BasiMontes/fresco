# Project configuration consumed by AI agents (Claude, Cursor, Gemini, Codex, etc.)
# when they encounter {{VAR_NAME}} references in prompts and docs.
# Variable names are snake_case; the AI maps {{PROJECT_NAME}} -> project.project_name lexically.
# Edit values manually.
# Every unfilled field carries a TODO comment with a concrete example.
#
# NOTE: This file is the Fresco project's live config — values are filled in.
# The upstream boilerplate ships it as a template with every value `null`;
# `bun run update` freezes this file (bootstrapOnlyPaths) so the real values survive.

project:
  project_name: fresco # fill per project — Project name (e.g. MyProject)
  project_key: FRESCO # fill per project — Project key in issue tracker (e.g. PROJ, OB, UPEX)
  webapp_domain: fresco-pro.vercel.app # fill per project — Domain of the web application under test (e.g. myproject.com). Confirmed 2026-08-08 via `vercel alias ls` as a REAL, auto-following Vercel Production domain — earlier in this same session it was wrongly assumed stale/fake and briefly replaced with a manually-aliased fresco-production.vercel.app, which does NOT auto-follow new deploys (a static alias); reverted to this one.

backend:
  backend_repo: . # fill per project — Relative path to backend repository (e.g. ../my-backend)
  backend_stack: Next.js + Supabase # fill per project — Backend technology stack (e.g. Node.js + Express)
  backend_entry: . # fill per project — Backend source entry point (e.g. src/)

frontend:
  frontend_repo: . # fill per project — Relative path to frontend repository (e.g. ../my-frontend)
  frontend_stack: Next.js # fill per project — Frontend technology stack (e.g. React + TypeScript)
  frontend_entry: . # fill per project — Frontend source entry point (e.g. src/)
  design_md_path: null # OPTIONAL — path to DESIGN.md produced by /design-system. Defaults to ./DESIGN.md when null. Override only for atypical layouts (e.g. .context/DESIGN.md).

database:
  db_type: Supabase # fill per project — Database engine (e.g. PostgreSQL)

issue_tracker:
  issue_tracker: Jira # fill per project — Issue tracking tool (e.g. Jira)
  issue_tracker_cli: acli # fill per project — CLI command to query tickets (e.g. acli (Jira) / gh issue (GitHub))
  atlassian_url: 'https://basiliomontescastano.atlassian.net' # fill per project — Atlassian instance base URL (e.g. https://company.atlassian.net). The acli `--site` slug is derived from this (strip `https://`); no separate ATLASSIAN_SITE variable.

testing:
  default_env: local # fill per project — Default working environment — must match a key under `environments:` (e.g. staging)

# Git workflow for THIS project — the SOURCE OF TRUTH read by the git-flow-master skill
# before any git/gh operation. Ships `null` (template): on the first git intent git-flow-master
# OFFERS "Strategy Setup" and fills these fields (it never auto-picks). Tracked + frozen by the
# updater (bootstrapOnly), so each project keeps its own. Filled by git-flow-master, NOT by
# `agents:setup`. These leaves are read directly (not {{VAR}} template vars) → skipped by vars:check.
git_strategy:
  strategy: solo-main # null until Strategy Setup runs; then one of: solo-main | main-integration | enterprise | trunk-based | gitflow | github-flow | gitlab-flow
  description: >
    Re-audited 2026-08-29 (re-audit finding 08, eje Trazabilidad): the
    `enterprise` three-tier value set 2026-08-21 declared a disciplined
    dev->staging->main promotion chain that never actually happened in
    practice — downgraded to `solo-main` to match observed history.
    Single maintainer (Basilio, one committer identity in `git log`);
    `git log --first-parent main --since=2026-08-21` shows the large
    majority of commits landing directly on `main` with no PR at all;
    of the PRs that were opened, merge method was inconsistent (some
    "Merge pull request" merge-commits, several landed via squash) —
    no enforced ff-only/merge-commit discipline. `dev` and `staging`
    remain long-lived branches (occasionally used as a PR base for
    feature/*/fix/* work, per team habit rather than mandate) but carry
    identical history to `main` at any given time — they function as
    Vercel-Preview-environment mirrors, not a real multi-hop promotion
    pipeline: fresco-dev.vercel.app (dev), fresco-pre.vercel.app
    (staging), fresco-pro.vercel.app (main/production), all bound via
    Vercel Project Settings -> Domains -> Git Branch (auto-tracks each
    branch's latest deploy). All three still carry GitHub branch
    protection (required status checks, FRESCO-279), so `protected:`
    keeps listing all three even though the base `solo-main` schema
    only names one. All three branches share the same Supabase project
    (jdqemhewjrjuopssdurn) — Vercel/branching split only, not a database
    split. Set up 2026-08-08 (main-integration), upgraded to three-tier
    2026-08-21, downgraded back to solo-main 2026-08-29 (FRESCO-286).
    2026-08-30 (FRESCO-314) made the remaining intent mechanical: GitHub
    repo settings now allow ONLY squash merges (merge-commit + rebase
    disabled, delete_branch_on_merge on), so every PR lands as exactly
    one commit on the target branch; the dev/staging/main mirror is kept
    byte-identical by ff-only pushes (no `--no-ff`, no squash on the
    mirror hop). docs/** direct-to-main is now an explicit policy, not a
    tolerated habit (see policy.docs_changes). Hotfix runbook:
    docs/workflows/hotfix.md. 2026-09-01 (FRESCO-377 / A4-M12): the
    promotion gate — `test:e2e` runs on push to `staging` (not just on
    PRs), so the squash SHA that mirrors to `main`/production has been
    e2e'd; before `git push origin main`, confirm that `staging` push's
    `test:e2e` run is green (`strict` stays `false`, so a stale-branch
    squash is still possible — this run is what catches it).
  branches:
    production: main # release / default branch
    integration: null # no disciplined integration tier in practice — dev/staging are env mirrors, not a promotion hop (see protected: below)
    ephemeral_pattern: null # on-demand trunk pattern, or null
  protected: [main, staging, dev] # all three carry GitHub branch protection (FRESCO-279) even though solo-main's base schema names only `main`
  decisions: # captured by the Strategy Setup questionnaire (Q1/Q2/Q3); made mechanical 2026-08-30 (FRESCO-314)
    promote_method: ff-only # dev/staging/main are kept byte-identical by fast-forward-only mirror pushes (`git push origin origin/dev:refs/heads/staging` etc.); never `--no-ff`, never squash on the mirror hop — this is what keeps the three branches identical, not a promotion pipeline
    feature_merge: squash # ENFORCED at the GitHub repo level 2026-08-30: allow_merge_commit=false, allow_rebase_merge=false, allow_squash_merge=true, delete_branch_on_merge=true. Every PR lands as exactly one commit on its target branch
    hotfix_policy: none # solo-main: an emergency fix is a normal direct change to `main` (via the dev->ff->staging->ff->main mirror) — no hotfix/* branch, no back-merge ceremony. Runbook: docs/workflows/hotfix.md
  policy: # how strictly protected branches are guarded (set by Strategy Setup Q4; defaults are safe)
    direct_push_to_protected: allowed # forbidden | confirm | allowed — matches observed practice: direct pushes to main happen routinely, no confirm ceremony
    admin_bypass: false # team POLICY: may a repo admin bypass PR/protection for urgent changes? actual capability still depends on the GitHub user's role — the skill re-confirms at runtime
    require_pr_reviews: 0 # null | 0 | N — min approvals before merge to a protected branch (informational) — solo maintainer, no reviewers
    docs_changes: direct-to-main-ok # FRESCO-314: docs-only changes (docs/**, .context/**, root *.md, .agents/*.md) MAY land on `main` directly through the dev->ff->main mirror, no PR required. A doc that documents a specific code change SHOULD ride in that change's PR instead (sprint-development gotcha #6). Session logs (.context/bitacora.md), ADRs, and business/PBI cache updates are the standing direct-to-main case
  branch_prefixes:
    precedence: [feat, fix, refactor, test, docs, chore]
    naming_with_key: '{prefix}/{ISSUE-KEY}-{kebab-slug}'
    naming_without_key: '{prefix}/{kebab-slug}'
  meta:
    setup_version: 4 # v4 2026-08-30 (FRESCO-314): squash-only enforced on GitHub, docs_changes policy added, hotfix runbook written
    created: 2026-07-24 # YYYY-MM-DD — first commit of this repo (6271533); the git_strategy block has existed since project bootstrap
    updated: 2026-08-29 # downgraded enterprise (three-tier) -> solo-main per re-audit finding 08 (declared strategy didn't match actual direct-push-heavy, single-maintainer practice)

# Variables declared above that are consumed OUTSIDE the {{TEMPLATE}} system
# (env vars in scripts/, shell `yq` reads embedded in skill docs, etc.).
# `bun run vars:check` skips DECLARED_BUT_UNUSED warnings for these.
# Each entry MUST include an inline `#` comment explaining WHERE the variable
# is consumed — if the comment is missing, the linter fails with
# EXTERNAL_CONSUMER_UNDOCUMENTED so the allowlist cannot rot silently.
external_consumers:
  - default_env # consumed implicitly by the AI variable resolver (sets active env for {{WEB_URL}} / {{API_URL}} / ...) AND by scripts/agents-setup.ts via process.env.DEFAULT_ENV in --non-interactive mode
  - design_md_path # read by `yq '.design_md_path'` inside bash code fences of .claude/skills/{design-system/references/getdesign-matcher.md, project-bootstrap/references/frontend-setup.md}

# Per-environment config. Add/remove environments freely (production, dev, qa, uat, etc.).
# Each environment must define ALL three keys: web_url, api_url, db_project_ref.
# Prompts referencing {{WEB_URL}} / {{API_URL}} / {{DB_PROJECT_REF}} resolve to the
# active environment (`testing.default_env` above, or a session override).
# For explicit cross-env references use {{environments.<env>.<var>}} (e.g. {{environments.local.web_url}}).
environments:
  local:
    web_url: 'http://localhost:3000' # fill per project — Frontend URL for local env (e.g. http://localhost:3000)
    api_url: 'http://localhost:3000/api' # fill per project — API base URL for local env (e.g. http://localhost:3000/api)
    db_project_ref: jdqemhewjrjuopssdurn # Supabase project ref for local — Fresco project (eu-west-1)
  dev:
    web_url: 'https://fresco-dev.vercel.app' # Auto-following Vercel domain bound to the `dev` branch (Git Branch binding — tracks branch HEAD, no manual `vercel alias set`). `dev` is where feature PRs land before promotion `dev` -> `staging` -> `main`. Listed here so the Edge CORS allowlist (`supabase/functions/_shared/cors.ts`) and any tooling that iterates `environments:` stops missing it (root cause of FRESCO-297).
    api_url: 'https://fresco-dev.vercel.app/api'
    db_project_ref: jdqemhewjrjuopssdurn # SAME Supabase project as local/staging/production — shared DB, deliberate (no isolation split).
  staging:
    web_url: 'https://fresco-pre.vercel.app' # Auto-following Vercel domain bound to the `staging` branch via Project Settings -> Domains -> Git Branch (same binding as `fresco-dev` / `fresco-pro`; tracks the branch's latest deploy, no manual `vercel alias set`). Re-verified live 2026-09-02 (FRESCO-393, A4-M23): `fresco-pre` and the auto branch domain `fresco-git-staging-basi-montes-projects.vercel.app` are co-located on the SAME `target: preview` deployment, distinct from the `target: production` deployment `fresco-pro` serves — it does NOT get reclaimed onto production (that was the pre-2026-08-21 ad-hoc-alias behaviour, fixed by the Git Branch binding). Propagation after a promotion is not instant: a fresh `staging` HEAD can take a few minutes to reach this domain, so still do a `vercel inspect https://fresco-pre.vercel.app` timestamp check before trusting it right after a merge. If it ever regresses, re-bind via Git Branch settings — not a one-off `vercel alias set`. Note: the branch domain 302s to Vercel SSO (Deployment Protection); `fresco-pre` itself is exempt and reachable without a Vercel account. `fresco-staging.vercel.app` is a separate, older stale alias — do not use it.
    api_url: 'https://fresco-pre.vercel.app/api'
    db_project_ref: jdqemhewjrjuopssdurn # Supabase project ref for staging — Fresco project (eu-west-1)
  production:
    web_url: 'https://fresco-pro.vercel.app' # Auto-following Vercel Production domain — always tracks the latest Production deploy of `main` (confirmed via `vercel alias ls` 2026-08-08; re-verified 2026-09-02, FRESCO-393). Same Git Branch binding family as `fresco-dev` / `fresco-pre`, but this one resolves to the `target: production` deployment. Same Supabase project as staging (user decision: shared DB, no isolation split — see master-implementation-plan.md §3 "Production environment provisioning").
    api_url: 'https://fresco-pro.vercel.app/api'
    db_project_ref: jdqemhewjrjuopssdurn # SAME Supabase project as staging/local — deliberate, not an oversight
